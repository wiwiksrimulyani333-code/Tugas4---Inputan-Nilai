
name: Build EXE Tugas 4

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile C++ to EXE
        run: cl /EHsc /std:c++17 main.cpp /Fe:main.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tugas4-Input-Nilai
          path: main.exe
